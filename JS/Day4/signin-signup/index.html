<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In & Sign Up</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="auth-container">
      <div class="auth-header">
        <h1>Welcome</h1>
        <p>Learn how forms and JavaScript validation work.</p>
      </div>

      <div class="form-switch">
        <button id="showSignIn" class="switch-btn active" type="button">
          Sign In
        </button>
        <button id="showSignUp" class="switch-btn" type="button">
          Sign Up
        </button>
      </div>

      <!-- SIGN IN FORM -->
      <form id="signInForm" class="auth-form" novalidate>
        <h2>Sign In</h2>

        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="Enter your email"
          />
          <small id="loginEmailError" class="error"></small>
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input
            type="password"
            id="loginPassword"
            placeholder="Enter your password"
          />
          <small id="loginPasswordError" class="error"></small>
        </div>

        <button type="submit" class="submit-btn">Sign In</button>

        <p id="loginSuccess" class="success-message"></p>
      </form>

      <!-- SIGN UP FORM -->
      <form id="signUpForm" class="auth-form hidden" novalidate>
        <h2>Create Account</h2>

        <div class="form-group">
          <label for="signupName">Full Name</label>
          <input
            type="text"
            id="signupName"
            placeholder="Enter your full name"
          />
          <small id="signupNameError" class="error"></small>
        </div>

        <div class="form-group">
          <label for="signupEmail">Email</label>
          <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
          />
          <small id="signupEmailError" class="error"></small>
        </div>

        <div class="form-group">
          <label for="signupPassword">Password</label>
          <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
          />
          <small id="signupPasswordError" class="error"></small>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter your password"
          />
          <small id="confirmPasswordError" class="error"></small>
        </div>

        <button type="submit" class="submit-btn">Create Account</button>

        <p id="signupSuccess" class="success-message"></p>
      </form>
    </div>
  </body>
</html>
