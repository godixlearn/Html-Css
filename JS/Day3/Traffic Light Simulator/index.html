<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Traffic Light</title>

    <link rel="stylesheet" href="styles.css">

    <script src="script.js" defer></script>
</head>

<body>

    <h1>Traffic Light Simulator</h1>


    <div class="traffic-light">

        <div
            id="redLight"
            class="light">
        </div>

        <div
            id="yellowLight"
            class="light">
        </div>

        <div
            id="greenLight"
            class="light">
        </div>

    </div>


    <div class="buttons">

        <button id="redButton">
            Red
        </button>

        <button id="yellowButton">
            Yellow
        </button>

        <button id="greenButton">
            Green
        </button>

    </div>


    <h2 id="message">
        Select a light
    </h2>

</body>
</html>
