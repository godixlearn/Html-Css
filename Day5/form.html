<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body{
            font-family: cursive;
            background-color: beige;
        }

        form{
            width: 400px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
        }

    </style>
</head>
<body>
    <h1>Student Registration Form</h1>

    <form>
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>
        <br><br>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required >
        <br><br>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
        <br><br>

        <label for="age">Age</label>
        <input type="number" id="age" placeholder="Enter your age" required>
        <br><br>

        <p>Gender:</p>
        <label for="male">Male</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="female">Female</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="other">Other</label>
        <input type="radio" id="other" name="gender" value="other">
        <br><br>

        <label for="message">About yourself:</label>
        <br>
        <textarea id="message" placeholder="Tell us about yourself" required></textarea>

        <br><br>

        <label for="terms & Conditions">I agree to the terms and conditions</label>
        <input type="checkbox" id="terms & Conditions" name="terms" required>

        <br><br>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
