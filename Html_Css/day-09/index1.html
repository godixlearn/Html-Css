<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>

        .hero{
            height: 100vh;


            background-image: url("assests/image copy.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;


        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .product-container {
            display: flex;

            justify-content: space-around;

            align-items: center;

            flex-wrap: wrap;

            gap: 40px;

            padding: 40px;
        }

        .product-card {
            width: 250px;
        }

        .product-card img {
            width: 100%;
            height: 150px;

            object-fit: cover;

            border-radius: 10px;
        }

        .product-card h2 {
            font-size: 20px;
        }

        .product-card p {
            color: lightslategray;
            line-height: 1.5;
        }

        .product-card button {
            width: 100%;

            padding: 10px;
            border-radius: 5px;

            border: none;



            background-color: #222;

            color: white;
        }
    </style>

</head>

<body>


    <section class="hero">
        <div class="online-shopping">
            <h1>Online shopping</h1>
        </div>
    </section>

    <section>
            <h1>Our Products</h1>

    <div class="product-container">

        <div class="product-card">
            <img src="./assests/image.png" alt="HeadPhone">

            <h2>Wireless Headphones</h2>

            <p>This have excelent sound quality</p>

            <h3>$20</h3>

            <button>Buy now</button>
        </div>

        <div class="product-card">
            <img src="./assests/shoe.png" alt="NikeShoe">

            <h2>Wireless Headphones</h2>

            <p>This have excelent sound quality</p>

            <h3>$20</h3>

            <button>Buy now</button>
        </div>


        <div class="product-card">
            <img src="./assests/watch.png" alt="HeadPhone">

            <h2>Wireless Headphones</h2>

            <p>This have excelent sound quality</p>

            <h3>$20</h3>

            <button>Buy now</button>
        </div>

        <div class="product-card">
            <img src="./assests/mobile.png" alt="HeadPhone">

            <h2>Wireless Headphones</h2>

            <p>This have excelent sound quality</p>

            <h3>$20</h3>

            <button>Buy now</button>
        </div>
    </div>
    </section>
</body>

</html>
